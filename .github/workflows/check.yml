name: Verificação Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testes Java, ponte e Electron
        run: npm run check
      - name: Empacotamento portatil Windows
        run: npm run package
      - name: Testar executavel portatil com dados ficticios
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'Executavel Windows nao encontrado.' }
          $env:AICH_EXECUTABLE = $exe
          npx playwright test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Executavel para teste manual
        uses: actions/upload-artifact@v4
        with:
          name: ai-creative-hub-windows-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Diagnostico dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-details
          path: test-results/
          retention-days: 7
