name: Verificação Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testes Java, ponte e Electron
        run: npm run check
      - name: Auditoria das dependências distribuídas
        run: npm audit --omit=dev
      - name: Empacotar instalador NSIS e portátil Windows
        run: npm run package
      - name: Verificar runtime Java 17 gerado
        shell: pwsh
        run: |
          $env:AICH_REQUIRE_RUNTIME = '1'
          node --test tests/runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - name: Executavel para teste manual
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Diagnostico dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-failure-details
          path: test-results/
          retention-days: 7
  without-system-java:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release
      - name: Remover Java externo do runner descartável e registrar inventário
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Remoção permitida somente neste runner hospedado descartável.'
          }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          $windows = [IO.Path]::GetFullPath($env:SystemRoot).TrimEnd('\') + '\'
          $allowedRoots = @($env:RUNNER_TOOL_CACHE, $env:ProgramFiles, ${env:ProgramFiles(x86)}, (Join-Path $env:ProgramData 'chocolatey')) |
            Where-Object { $_ } | ForEach-Object { [IO.Path]::GetFullPath($_).TrimEnd('\') + '\' }
          $volumes = @(Get-CimInstance Win32_LogicalDisk -Filter 'DriveType = 3' | ForEach-Object { $_.DeviceID + '\' })
          if (-not $volumes.Count) { throw 'Nenhum volume fixo identificado.' }
          $volumes | Set-Content release/scanned-volumes.txt
          # Busca física, incluindo runtimes fora de PATH e JAVA_HOME. Nenhum build é executado depois.
          $javaExecutables = @($volumes | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter java.exe -File -Recurse -Force -ErrorAction SilentlyContinue })
          $javaExecutables.FullName | Set-Content release/external-java-before.txt
          foreach ($java in $javaExecutables) {
            if (-not (Test-Path -LiteralPath $java.FullName)) { continue }
            $root = [IO.Path]::GetFullPath((Split-Path (Split-Path $java.FullName -Parent) -Parent))
            $allowed = @($allowedRoots | Where-Object { ($root + '\').StartsWith($_, [StringComparison]::OrdinalIgnoreCase) }).Count -gt 0
            if (-not $allowed -or $root.Length -lt 5 -or ($root + '\').StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase) -or
                ($root + '\').StartsWith($windows, [StringComparison]::OrdinalIgnoreCase) -or
                (Split-Path $java.DirectoryName -Leaf) -ne 'bin' -or
                -not (Test-Path -LiteralPath (Join-Path $root 'release')) -or
                -not (Select-String -LiteralPath (Join-Path $root 'release') -Pattern '^JAVA_VERSION=' -Quiet)) {
              throw "Runtime externo em caminho não reconhecido; revisar imagem: $($java.FullName)"
            }
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
          foreach ($key in @('HKLM:\SOFTWARE\JavaSoft', 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft', 'HKCU:\SOFTWARE\JavaSoft')) {
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Recurse -Force }
          }
          foreach ($key in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall')) {
            Get-ItemProperty -Path "$key\*" -ErrorAction SilentlyContinue |
              Where-Object DisplayName -Match '(?i)(openjdk|temurin|adoptium|semeru|\bJDK\b|\bJRE\b|Java [0-9])' |
              ForEach-Object { Remove-Item -LiteralPath $_.PSPath -Recurse -Force }
          }
          Get-ChildItem Env: | Where-Object Name -Match '^(JAVA_HOME|JDK_HOME|JRE_HOME)(_|$)' | ForEach-Object {
            Remove-Item -LiteralPath "Env:$($_.Name)"
            "$($_.Name)=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $remaining = @($volumes | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter java.exe -File -Recurse -Force -ErrorAction SilentlyContinue })
          if ($remaining.Count) { throw "Java externo restante: $($remaining.FullName -join ', ')" }
          & "$env:SystemRoot\System32\where.exe" java 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Java ainda disponível no PATH.' }
          $global:LASTEXITCODE = 0
          "No accessible external java.exe found on fixed volumes ($($volumes -join ', ')) before installation. Commit: $env:GITHUB_SHA" | Set-Content release/no-system-java.txt
      - name: Testar todos os fluxos no portátil real sem Java instalado
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:AICH_EXECUTABLE = (Resolve-Path "release/AI-Creative-Hub-Portable-$version-x64.exe").Path
          node node_modules/@playwright/test/cli.js test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar, testar, reinstalar e desinstalar preservando dados
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-installed.ps1 -Installer "release/AI-Creative-Hub-Setup-$version-x64.exe"
      - name: Executáveis aprovados nos testes Windows
        uses: actions/upload-artifact@v4
        with:
          name: ai-creative-hub-windows-tested
          path: |
            release/*.exe
            release/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Diagnóstico dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-test-failure-details
          path: |
            test-results/
            release/*.txt
          retention-days: 7
